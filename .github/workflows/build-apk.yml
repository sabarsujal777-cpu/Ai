name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"

          VERSION_LINE="$(java -version 2>&1 | head -n 1 || true)"
          if [[ "$VERSION_LINE" =~ \"([0-9]+)(\.([0-9]+))? ]]; then
            JAVA_MAJOR="${BASH_REMATCH[1]}"
            if [[ "$JAVA_MAJOR" == "1" && -n "${BASH_REMATCH[3]:-}" ]]; then
              JAVA_MAJOR="${BASH_REMATCH[3]}"
            fi
          else
            echo "::error::Unable to detect the active Java version from: $VERSION_LINE"
            exit 1
          fi

          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid detected Java major version: $JAVA_MAJOR"
            exit 1
          fi

          echo "Detected active Java major version: $JAVA_MAJOR"
          if (( JAVA_MAJOR < 17 )); then
            echo "::error::Java 17 or newer is required, but detected Java $JAVA_MAJOR."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYTOOL_BIN="keytool"
          if [[ -n "${JAVA_HOME:-}" && -x "${JAVA_HOME}/bin/keytool" ]]; then
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
          fi

          if [[ -f "./debug.keystore" ]]; then
            echo "Debug keystore already exists at ./debug.keystore; skipping generation."
          else
            echo "Generating temporary debug keystore at ./debug.keystore..."
            if ! "$KEYTOOL_BIN" -genkeypair \
              -v \
              -keystore "./debug.keystore" \
              -storepass "android" \
              -alias "androiddebugkey" \
              -keypass "android" \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg "RSA" \
              -keysize 2048 \
              -validity 10000 \
              -noprompt >/dev/null 2>&1; then
              echo "::error::Failed to create temporary debug keystore at ./debug.keystore."
              exit 1
            fi
          fi

          if [[ ! -f "./debug.keystore" || ! -s "./debug.keystore" ]]; then
            echo "::error::Temporary debug keystore ./debug.keystore is missing or empty after generation."
            exit 1
          fi
          echo "Temporary debug keystore verified at ./debug.keystore."

      - name: Build debug APK
        id: build_debug_apk
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -e "$EXPECTED_APK" ]]; then
            echo "::error::Expected debug APK not found at: $EXPECTED_APK"
            if [[ -d "app/build/outputs/apk" ]]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              find "app/build/outputs/apk" -type f -name "*.apk" -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [[ ! -f "$EXPECTED_APK" ]]; then
            echo "::error::Expected path is not a regular file: $EXPECTED_APK"
            exit 1
          fi

          if [[ ! -s "$EXPECTED_APK" ]]; then
            echo "::error::Expected debug APK is empty: $EXPECTED_APK"
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::Expected file does not have .apk extension: $EXPECTED_APK"
            exit 1
          fi

          echo "Verified debug APK: $EXPECTED_APK ($(wc -c < "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -f "$SOURCE_APK" || ! -s "$SOURCE_APK" ]]; then
            echo "::error::Verified APK missing at $SOURCE_APK"
            exit 1
          fi

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO="$(printf '%s' "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//')"
          if [[ -z "$SANITIZED_REPO" ]]; then
            SANITIZED_REPO="android-app"
          fi

          ASSET_FILENAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_TMP_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-asset.XXXXXX")"
          ASSET_PATH="${RELEASE_TMP_DIR}/${ASSET_FILENAME}"

          cp "$SOURCE_APK" "$ASSET_PATH"

          if [[ ! -f "$ASSET_PATH" || ! -s "$ASSET_PATH" || "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset validation failed for $ASSET_PATH"
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset filename: ${ASSET_FILENAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh --version

          if [[ -z "${ASSET_PATH:-}" || ! -f "$ASSET_PATH" || ! -s "$ASSET_PATH" || "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset is missing, empty, or not an .apk file."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/release-notes.XXXXXX.md")"

          cat > "$NOTES_FILE" <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - **GitHub Actions Run Number:** ${GITHUB_RUN_NUMBER}
          - **GitHub Actions Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **Artifact Filename:** \`${ASSET_NAME}\`

          **Important Notes:**
          - This APK is intended for testing purposes only.
          - This APK is **not** a Play Store production release.
          - This APK is signed only with a temporary debug keystore.
          EOF

          gh release create "$RELEASE_TAG" \
            "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "$GITHUB_SHA" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.upload_artifact.outcome }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [[ "$PUBLISH_OUTCOME" == "success" ]]; then
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq .url)"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            echo "The APK can be downloaded directly from the release Assets section."
            echo "Backup Actions artifact 'app-debug-apk' is also available."

            {
              echo "### Debug APK Published to GitHub Releases"
              echo ""
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
              echo "- **Release Page URL:** ${RELEASE_URL}"
              echo ""
              echo "Download the APK directly from the **Assets** section on the GitHub Release page."
              echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$ARTIFACT_OUTCOME" == "success" ]]; then
            echo "::warning::GitHub Release publishing failed, but the debug APK build and Actions artifact upload succeeded."
            echo "Actions artifact 'app-debug-apk' remains available for download."

            {
              echo "### Debug APK Build Succeeded (Release Publishing Failed)"
              echo ""
              echo "> **Warning:** Publishing the APK to GitHub Releases did not succeed."
              echo ""
              echo "- **APK Build:** Succeeded"
              echo "- **Backup Actions Artifact:** \`app-debug-apk\` remains available in the workflow run Artifacts section."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Debug APK build or artifact upload did not complete; release publishing was not performed."
            {
              echo "### Debug APK Build Incomplete"
              echo ""
              echo "> **Warning:** The debug APK build or artifact upload did not complete before release publishing."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
